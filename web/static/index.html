<!doctype html>
<html lang="en">
<head>
<title>SoluAI · Predict water solubility</title>
<meta name="description" content="Predict how well a molecule dissolves in water, and see why.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<script>/* apply the saved (or system) theme before the page paints, to avoid a flash */
(function(){var t=null;try{t=localStorage.getItem("soluai-theme")}catch(e){}
if(!t){t=window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
document.documentElement.dataset.theme=t})();</script>
<script src="/static/js/common.js"></script>
<script src="/static/js/predict.js" defer></script>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <span class="eyebrow">Machine learning × chemistry</span>
    <h1>Will it dissolve in water?</h1>
    <p class="lead">Type a molecule's name or SMILES. A model trained on 8,700 measured molecules predicts its solubility and shows which atoms help or hurt it.</p>
    <form class="search" id="search-form" autocomplete="off">
      <span aria-hidden="true" id="search-icon"></span>
      <input id="query" name="q" placeholder="e.g. caffeine, glucose, or CCO" aria-label="Molecule name or SMILES" maxlength="300" spellcheck="false">
      <button class="btn" id="go" type="submit">Predict</button>
    </form>
    <div class="input-row"><span class="hint">Name lookup uses PubChem. Offline, use the list below or a SMILES such as <code>c1ccccc1O</code> (phenol).</span></div>
    <div class="picker">
      <div class="picker-tabs" id="picker-tabs"></div>
      <div class="chips" id="chips"></div>
    </div>
  </section>
  <section id="result" aria-live="polite"></section>
</main>
</body>
</html>
